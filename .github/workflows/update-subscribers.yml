name: Update MAX subscribers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add verified MAX certificate
        run: |
          curl --fail --silent --show-error --insecure \
            -o russian-root-ca.cer \
            https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer

          fingerprint="$(openssl x509 -in russian-root-ca.cer -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          test "$fingerprint" = "8FF915CCAB7BC16F8C5C8099D53E0E115B3AEC2F"

          curl --fail --silent --show-error --insecure \
            -o russian-sub-ca.cer \
            https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer

          openssl verify -CAfile russian-root-ca.cer russian-sub-ca.cer
          cat russian-root-ca.cer russian-sub-ca.cer > max-ca.pem

      - name: Get subscriber count
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --cacert max-ca.pem \
            -H "Authorization: ${MAX_BOT_TOKEN}" \
            "https://platform-api2.max.ru/chats/${MAX_CHAT_ID}")"
          count="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["participants_count"])' <<< "$response")"
          printf '{"count": %s}\n' "$count" > subscribers.json

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          git diff --cached --quiet || git commit -m "Update subscriber count"
          git push
